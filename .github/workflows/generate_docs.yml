name: Generate HTML doc using Rocqnavi

on:
  push:
    branches-ignore: ["gh-pages"]
  pull_request:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref }}

jobs:
  generate-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set the variables for push event
        if: ${{ github.event_name == 'push' }}
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          short_sha=$(git rev-parse --short "$SHA")
          echo "destination_dir=mathcomp-analysis_${BRANCH_NAME}_${short_sha}" >> "$GITHUB_ENV"

      - name: Set the variables for PR event
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "destination_dir=mathcomp-analysis_${BRANCH_NAME}" >> "$GITHUB_ENV"

      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git
            rocq-released: https://rocq-prover.org/opam/released
            rocq-extra-dev: https://rocq-prover.org/opam/extra-dev

      - name: Build Mathcomp Analysis
        run: |
          opam pin add -y rocq-navi "git+https://github.com/affeldt-aist/rocqnavi.git#mca2html"
          opam install -y --deps-only . --with-doc && opam exec -- make -j 4

      - name: Generate Documents
        run: |
          mkdir -p artifact
          opam exec -- make html
          cp -r html artifact/${{ env.destination_dir }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.destination_dir }}
          path: artifact
